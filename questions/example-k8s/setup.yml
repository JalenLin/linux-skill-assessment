# Runs once when the template is built, with internet access (eth0 is NATed during the build).
# The inventory has one host per node (cp1, w1, w2). Extra variables:
#   node_ip   = this node's IP on its first question network (eth1)
#   lsa_nodes = {name: {mgmt_ip, ips: {network: ip}}} for every node
# The whole cluster is created here and stored in the templates; participant groups are clones of it,
# with the same IPs and hostnames on their own VLAN, so the cluster just keeps working.
- name: Kubernetes packages on every node
  hosts: all
  gather_facts: false
  vars:
    k8s_minor: ""            # e.g. v1.37; empty = latest stable at build time
  tasks:
    - name: Latest stable Kubernetes release
      ansible.builtin.uri:
        url: https://dl.k8s.io/release/stable.txt
        return_content: true
      register: stable
      run_once: true
      when: not k8s_minor

    - name: Kubernetes minor version for the apt repository
      ansible.builtin.set_fact:
        k8s_repo: "{{ k8s_minor or (stable.content | trim | regex_replace('^(v[0-9]+[.][0-9]+).*$', '\\1')) }}"

    - name: All nodes in /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ item.value.ips.lab }} {{ item.key }}"
      loop: "{{ lsa_nodes | dict2items }}"

    - name: Kernel modules for container networking
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: "overlay\nbr_netfilter\n"
        mode: "0644"

    - name: Load them now
      ansible.builtin.command: modprobe {{ item }}
      loop: [overlay, br_netfilter]
      changed_when: false

    - name: Forwarding and bridge netfilter
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-k8s.conf
        content: |
          net.ipv4.ip_forward = 1
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
        mode: "0644"

    - name: Apply sysctl
      ansible.builtin.command: sysctl --system
      changed_when: false

    - name: Apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Docker apt key (containerd.io)
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Kubernetes apt key
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/{{ k8s_repo }}/deb/Release.key"
        dest: /etc/apt/keyrings/kubernetes.asc
        mode: "0644"

    - name: Apt repositories
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/k8s.list
        content: |
          deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable
          deb [signed-by=/etc/apt/keyrings/kubernetes.asc] https://pkgs.k8s.io/core:/stable:/{{ k8s_repo }}/deb/ /
        mode: "0644"

    - name: containerd, kubelet, kubeadm, kubectl
      ansible.builtin.apt:
        name: [containerd.io, kubelet, kubeadm, kubectl]
        update_cache: true

    - name: Hold the Kubernetes packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: [kubelet, kubeadm, kubectl]

    - name: containerd default config (the package ships one with CRI disabled)
      ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
      changed_when: true

    - name: containerd uses the systemd cgroup driver
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    - name: Restart containerd
      ansible.builtin.systemd_service:
        name: containerd
        state: restarted
        enabled: true

    - name: crictl talks to containerd
      ansible.builtin.copy:
        dest: /etc/crictl.yaml
        content: "runtime-endpoint: unix:///run/containerd/containerd.sock\n"
        mode: "0644"

    - name: kubelet uses the question network (eth1), not the management network
      ansible.builtin.copy:
        dest: /etc/default/kubelet
        content: "KUBELET_EXTRA_ARGS=--node-ip={{ node_ip }}\n"
        mode: "0644"

    - name: Pre-pull the web image (participant environments are offline)
      ansible.builtin.command: ctr -n k8s.io images pull docker.io/library/nginx:1.27-alpine
      changed_when: false
      when: inventory_hostname != 'cp1'

- name: Control plane
  hosts: cp1
  gather_facts: false
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: kubeadm init
      ansible.builtin.command: >
        kubeadm init --apiserver-advertise-address={{ node_ip }} --node-name cp1
        --pod-network-cidr=10.244.0.0/16
      args:
        creates: /etc/kubernetes/admin.conf

    - name: kubeconfig for root and user
      ansible.builtin.shell: |
        for h in /root /home/user; do
          install -d -m 700 $h/.kube
          install -m 600 /etc/kubernetes/admin.conf $h/.kube/config
        done
        chown -R user:user /home/user/.kube
      changed_when: true

    - name: Flannel manifest
      ansible.builtin.get_url:
        url: https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
        dest: /root/kube-flannel.yml
        mode: "0644"

    - name: Flannel uses eth1
      ansible.builtin.replace:
        path: /root/kube-flannel.yml
        regexp: '^(\s+)- --kube-subnet-mgr$'
        replace: '\1- --kube-subnet-mgr\n\1- --iface=eth1'

    - name: Install flannel
      ansible.builtin.command: kubectl apply -f /root/kube-flannel.yml
      changed_when: true

    - name: Join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join
      changed_when: false

- name: Workers
  hosts: all:!cp1
  gather_facts: false
  tasks:
    - name: kubeadm join
      ansible.builtin.command: "{{ hostvars['cp1'].join.stdout }} --node-name {{ inventory_hostname }}"
      args:
        creates: /etc/kubernetes/kubelet.conf

- name: Workload and the fault
  hosts: cp1
  gather_facts: false
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: All nodes Ready
      ansible.builtin.command: kubectl wait --for=condition=Ready node --all --timeout=600s
      changed_when: false

    - name: Deployment web
      ansible.builtin.shell: |
        kubectl get deployment web || kubectl create deployment web --image=docker.io/library/nginx:1.27-alpine --replicas=2
      changed_when: true

    - name: Deployment is ready
      ansible.builtin.command: kubectl rollout status deployment/web --timeout=300s
      changed_when: false

- name: "Fault: kubelet stopped and disabled on w2"
  hosts: w2
  gather_facts: false
  tasks:
    - name: Stop kubelet
      ansible.builtin.systemd_service:
        name: kubelet
        state: stopped
        enabled: false

- name: Wait until the control plane sees w2 as NotReady (otherwise the template stores a stale Ready)
  hosts: cp1
  gather_facts: false
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    # a node whose kubelet stops goes to Ready=Unknown (shown as NotReady), not Ready=False
    - name: w2 NotReady
      ansible.builtin.shell: kubectl get node w2 --no-headers | grep -qw NotReady
      register: nr
      until: nr.rc == 0
      retries: 60
      delay: 5
      changed_when: false
