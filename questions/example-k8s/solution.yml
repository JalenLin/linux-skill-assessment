- hosts: w2
  gather_facts: false
  tasks:
    - name: Start kubelet and enable it at boot
      ansible.builtin.systemd_service:
        name: kubelet
        state: started
        enabled: true

- hosts: cp1
  gather_facts: false
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Wait for the API server
      ansible.builtin.command: kubectl get --raw /readyz
      register: ready
      until: ready.rc == 0
      retries: 36
      delay: 5
      changed_when: false

    - name: w2 Ready
      ansible.builtin.command: kubectl wait --for=condition=Ready node/w2 --timeout=300s
      changed_when: false

    - name: Scale web to 3
      ansible.builtin.command: kubectl scale deployment web --replicas=3
      changed_when: true

    - name: Rollout
      ansible.builtin.command: kubectl rollout status deployment/web --timeout=300s
      changed_when: false
