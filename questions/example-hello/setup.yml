# Runs once when the template is built (as root, with internet access): install what is needed and plant the faults.
# Participant environments have no internet access, so install every package you need here.
- hosts: target
  gather_facts: false
  tasks:
    # The base template already has python3, curl, openssh and sudo; use apt for anything else:
    # - ansible.builtin.apt: {name: [nginx], update_cache: true}

    - name: Web directory
      ansible.builtin.file:
        path: /srv/hello
        state: directory
        mode: "0755"

    - name: Web page
      ansible.builtin.copy:
        dest: /srv/hello/index.html
        content: "Hello Lab\n"
        mode: "0600"           # fault 2: the service runs as nobody and cannot read a root-owned 0600 file

    - name: Service unit (contains fault 1, see files/hello.service)
      ansible.builtin.copy:
        src: files/hello.service
        dest: /etc/systemd/system/hello.service
        mode: "0644"

    - name: "Fault 3: not enabled at boot"
      ansible.builtin.systemd_service:
        name: hello
        daemon_reload: true
        enabled: false
