# 建置範本時執行一次（以 root、可上網）：安裝需要的東西，並「埋入錯誤」。
# 測驗時作答者的環境不能上網，要用到的套件都要在這裡先裝好。
- hosts: target
  gather_facts: false
  tasks:
    # base 範本已經有 python3、curl、openssh、sudo；需要其他套件就用 apt：
    # - ansible.builtin.apt: {name: [nginx], update_cache: true}

    - name: 網頁目錄
      ansible.builtin.file:
        path: /srv/hello
        state: directory
        mode: "0755"

    - name: 網頁內容
      ansible.builtin.copy:
        dest: /srv/hello/index.html
        content: "Hello Lab\n"
        mode: "0600"           # 錯誤 2：服務以 nobody 執行，讀不到 0600、屬於 root 的檔案

    - name: 服務設定（含錯誤 1，見 files/hello.service）
      ansible.builtin.copy:
        src: files/hello.service
        dest: /etc/systemd/system/hello.service
        mode: "0644"

    - name: 錯誤 3：沒有設定開機啟動
      ansible.builtin.systemd_service:
        name: hello
        daemon_reload: true
        enabled: false
