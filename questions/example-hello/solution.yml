# Reference solution (optional, strongly recommended): the admin "Self-test" verifies that
#   unsolved → check.yml scores 0; after applying this solution → full marks
# Participants never see this file.
- hosts: target
  gather_facts: false
  tasks:
    - name: Fix the python path in ExecStart
      ansible.builtin.replace:
        path: /etc/systemd/system/hello.service
        regexp: '/usr/bin/python '
        replace: '/usr/bin/python3 '

    - name: Let nobody read the page
      ansible.builtin.file:
        path: /srv/hello/index.html
        mode: "0644"

    - name: Start it and enable at boot
      ansible.builtin.systemd_service:
        name: hello
        daemon_reload: true
        enabled: true
        state: restarted
