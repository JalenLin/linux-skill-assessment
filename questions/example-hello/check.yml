# Grading: runs when the participant presses "Check answer" (the final check after the set ends uses it too).
# - task names start with "check:<id>", matching checks in question.yaml; an id scores only if all its tasks succeed
# - variable target_ip = IP of the participant's environment
# - participants have root in their environment and could tamper with curl or systemctl; whatever can be
#   verified from outside, run with delegate_to: localhost (on the grading host)
- hosts: target
  gather_facts: false
  ignore_errors: true          # required: keep checking the other items after one fails
  tasks:
    - name: "check:page browse the page from the grading host"
      ansible.builtin.uri:
        url: "http://{{ target_ip }}:8000/"
        return_content: true
        timeout: 5
      register: page
      failed_when: page.status != 200 or 'Hello Lab' not in page.content
      delegate_to: localhost

    - name: "check:boot enabled at boot"
      ansible.builtin.command: systemctl is-enabled hello
      changed_when: false

    # "still works after a restart": actually restart it during the check, then verify
    - name: "check:restart restart the service"
      ansible.builtin.systemd_service:
        name: hello
        state: restarted

    - name: "check:restart wait for the service"
      ansible.builtin.wait_for:
        host: "{{ target_ip }}"
        port: 8000
        timeout: 10
      delegate_to: localhost

    - name: "check:restart browse again after the restart"
      ansible.builtin.uri:
        url: "http://{{ target_ip }}:8000/"
        return_content: true
        timeout: 5
      register: page2
      failed_when: page2.status != 200 or 'Hello Lab' not in page2.content
      delegate_to: localhost
