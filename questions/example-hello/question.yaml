# Example question: shows every field of a question package. Copy this folder, rename it and change
# the contents to make your own question. Folder name = question id (lowercase letters, digits and -).
title: The hello service won't start (example)
type: lxc            # lxc (container; default, light) or vm (needs kernel features: disks, NFS server, kernel modules…)
hostname: hello      # hostname the participant sees
resources:
  cores: 1
  memory: 512        # MB; 1024 recommended for vm questions
lang: en             # language of the main content (title, description.md, checks desc); default zh-TW
checks:              # check items; points can be adjusted per question set in the admin UI, these are defaults
  - id: page
    desc: "http://<host>:8000/ can be browsed from another computer and shows Hello Lab"
    points: 6
  - id: boot
    desc: The hello service is enabled to start at boot
    points: 2
  - id: restart
    desc: The page still works after restarting the hello service
    points: 2

# Optional: title and check descriptions in other languages (descriptions go in description.<code>.md).
# Use the UI language codes: zh-TW, en, …
i18n:
  zh-TW:
    title: Hello 服務無法啟動（範例題）
    checks:
      page: 從其他電腦瀏覽 http://<本機>:8000/ 可看到 Hello Lab
      boot: hello 服務設為開機自動啟動
      restart: 重新啟動 hello 服務後網頁仍正常
