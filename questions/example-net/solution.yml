- hosts: r1
  gather_facts: false
  tasks:
    - name: Forwarding on, also at boot
      ansible.builtin.copy:
        dest: /etc/sysctl.d/60-router.conf
        content: "net.ipv4.ip_forward = 1\n"
        mode: "0644"
    - name: Apply now
      ansible.builtin.command: sysctl --system
      changed_when: true

- hosts: web
  gather_facts: false
  tasks:
    - name: Allow the LAN to reach port 80
      ansible.builtin.lineinfile:
        path: /etc/nftables.conf
        insertafter: 'ip saddr 172.16.0.0/24 tcp dport 80 accept'
        line: '    iifname "eth1" ip saddr 192.168.10.0/24 tcp dport 80 accept'
    - name: Reload the firewall
      ansible.builtin.systemd_service:
        name: nftables
        state: restarted
