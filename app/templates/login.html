{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h2>{{ _("登入") }}</h2>
  <p class="muted">{{ _("請使用管理者發給你的帳號密碼。") }}</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <label>{{ _("帳號") }}</label><input type="text" name="username" autocomplete="username" required autofocus>
    <label>{{ _("密碼") }}</label><input type="password" name="password" autocomplete="current-password" required>
    <p><button class="primary" type="submit">{{ _("登入") }}</button></p>
  </form>
</div>
{% endblock %}
