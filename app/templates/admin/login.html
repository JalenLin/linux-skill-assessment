{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h2>{{ _("管理後台登入") }}</h2>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/login">
    <label>{{ _("帳號") }}</label><input type="text" name="username" required autofocus>
    <label>{{ _("密碼") }}</label><input type="password" name="password" required>
    <p><button class="primary" type="submit">{{ _("登入") }}</button></p>
  </form>
</div>
{% endblock %}
